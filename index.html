<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CafeBot - Order Your Coffee</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #fdfaf7;
            --surface: #ffffff;
            --primary: #6f4e37;
            --primary-light: #a67b5b;
            --text: #2d241e;
            --text-muted: #7c6f64;
            --border: #e8dfd5;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
            --radius: 18px;
            --success: #4caf50;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1614;
                --surface: #2d241e;
                --primary: #a67b5b;
                --primary-light: #c9a68a;
                --text: #fdfaf7;
                --text-muted: #a89a8e;
                --border: #3d342e;
                --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
            }
        }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: var(--surface);
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
            z-index: 10;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            margin: 0;
            font-size: 1.25rem;
            color: var(--primary);
        }

        .cart-trigger {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: background 0.2s;
        }

        .cart-trigger:hover {
            background: var(--primary-light);
        }

        .cart-badge {
            background: white;
            color: var(--primary);
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 800;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        #chat-feed {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 80%;
            padding: 0.75rem 1rem;
            border-radius: var(--radius);
            font-size: 0.9375rem;
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.bot {
            align-self: flex-start;
            background-color: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .message.user {
            align-self: flex-end;
            background-color: var(--primary);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .quick-actions {
            padding: 0 1.5rem 0.5rem;
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }

        .quick-actions::-webkit-scrollbar {
            display: none;
        }

        .action-chip {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8125rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-chip:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .input-area {
            padding: 1rem 1.5rem;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        #user-input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 25px;
            background: var(--bg);
            color: var(--text);
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        #user-input:focus {
            border-color: var(--primary);
        }

        #send-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        #send-btn:hover {
            background: var(--primary-light);
        }

        /* Cart Panel */
        #cart-panel {
            position: fixed;
            right: -350px;
            top: 0;
            width: 320px;
            height: 100vh;
            background: var(--surface);
            border-left: 1px solid var(--border);
            box-shadow: var(--shadow);
            transition: right 0.3s ease;
            z-index: 20;
            display: flex;
            flex-direction: column;
        }

        #cart-panel.open {
            right: 0;
        }

        .cart-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-header h2 {
            font-family: 'Playfair Display', serif;
            margin: 0;
            font-size: 1.25rem;
            color: var(--primary);
        }

        .close-cart {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .cart-footer {
            padding: 1.5rem;
            border-top: 1px solid var(--border);
            background: var(--bg);
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }

        .btn-checkout {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-checkout:hover {
            background: var(--primary-light);
        }

        .typing-indicator {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
            display: none;
        }

        @media (max-width: 600px) {
            #cart-panel { width: 100%; right: -100%; }
        }
    </style>
</head>
<body>
    <header>
        <h1>☕ CafeBot</h1>
        <button class="cart-trigger" onclick="toggleCart()">
            🛒 Cart <span id="cart-count" class="cart-badge">0</span>
        </button>
    </header>

    <main>
        <div id="chat-feed">
            <div class="message bot">Hello! Welcome to NetCafe. I'm CafeBot. How can I help you today? ☕</div>
        </div>
        <div id="typing" class="typing-indicator" style="padding: 0 1.5rem;">CafeBot is typing...</div>
        <div class="quick-actions">
            <button class="action-chip" onclick="sendQuickAction('Show me the menu')">☕ View Menu</button>
            <button class="action-chip" onclick="sendQuickAction('What is in my cart?')">🛒 My Cart</button>
            <button class="action-chip" onclick="sendQuickAction('I want to order coffee')">📝 Start Order</button>
            <button class="action-chip" onclick="sendQuickAction('How can you help me?')">❓ Help</button>
        </div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Type your message..." autocomplete="off">
            <button id="send-btn" onclick="handleSend()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 22 2 2"></polygon></svg>
            </button>
        </div>
    </main>

    <div id="cart-panel">
        <div class="cart-header">
            <h2>Your Order</h2>
            <button class="close-cart" onclick="toggleCart()">&times;</button>
        </div>
        <div id="cart-items" class="cart-items">
            <!-- Items will be injected here -->
            <div style="text-align:center; color:var(--text-muted); margin-top:2rem;">Your cart is empty</div>
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cart-total">$0.00</span>
            </div>
            <button class="btn-checkout" onclick="sendQuickAction('checkout')">Checkout Now</button>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        let sessionId = localStorage.getItem('cafebot_session_id') || 'sess_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('cafebot_session_id', sessionId);

        let chatHistory = [];

        async function handleSend() {
            const input = document.getElementById('user-input');
            const message = input.value.trim();
            if (!message) return;

            input.value = '';
            appendMessage('user', message);

            await sendMessage(message);
        }

        async function sendQuickAction(text) {
            appendMessage('user', text);
            await sendMessage(text);
        }

        async function sendMessage(text) {
            const typing = document.getElementById('typing');
            typing.style.display = 'block';

            try {
                const response = await fetch(`${API_BASE}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: text,
                        history: chatHistory,
                        sessionId: sessionId
                    })
                });

                const data = await response.json();

                typing.style.display = 'none';
                appendMessage('bot', data.reply);
                chatHistory = data.history;

                if (data.orderState) {
                    updateCartUI(data.orderState);
                }
            } catch (error) {
                typing.style.display = 'none';
                appendMessage('bot', 'Sorry, I am having trouble connecting to the cafe server. Please try again in a moment. ☕');
                console.error('Chat Error:', error);
            }
        }

        function appendMessage(sender, text) {
            const feed = document.getElementById('chat-feed');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.textContent = text;
            feed.appendChild(msgDiv);
            feed.scrollTop = feed.scrollHeight;
        }

        function updateCartUI(state) {
            const itemsContainer = document.getElementById('cart-items');
            const totalEl = document.getElementById('cart-total');
            const countEl = document.getElementById('cart-count');

            if (!state.items || state.items.length === 0) {
                itemsContainer.innerHTML = '<div style="text-align:center; color:var(--text-muted); margin-top:2rem;">Your cart is empty</div>';
                totalEl.textContent = '$0.00';
                countEl.textContent = '0';
                return;
            }

            itemsContainer.innerHTML = state.items.map(item => `
                <div class="cart-item">
                    <span>${item.name} <small>x${item.quantity}</small></span>
                    <span>$${(item.price * item.quantity).toFixed(2)}</span>
                </div>
            `).join('');

            totalEl.textContent = `$${state.total.toFixed(2)}`;
            countEl.textContent = state.items.length;
        }

        function toggleCart() {
            document.getElementById('cart-panel').classList.toggle('open');
        }

        // Handle Enter key
        document.getElementById('user-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });

        // Initial welcome
        window.onload = () => {
            // We could call /api/chat with a "hello" to sync orderState on load
        };
    </script>
</body>
</html>
