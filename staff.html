<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CafeBot Staff Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #fdfaf7;
            --surface: #ffffff;
            --primary: #6f4e37;
            --primary-light: #a67b5b;
            --text: #2d241e;
            --text-muted: #7c6f64;
            --border: #e8dfd5;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
            --radius: 18px;
            --success: #4caf50;
            --warning: #ff9800;
            --info: #2196f3;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1614;
                --surface: #2d241e;
                --primary: #a67b5b;
                --primary-light: #c9a68a;
                --text: #fdfaf7;
                --text-muted: #a89a8e;
                --border: #3d342e;
                --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
            }
        }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding: 0;
            min-height: 100vh;
        }

        header {
            background-color: var(--surface);
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
            box-shadow: var(--shadow);
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            margin: 0;
            font-size: 1.5rem;
            color: var(--primary);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: var(--success);
            border-radius: 50%;
        }

        main {
            padding: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .orders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .order-card {
            background-color: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease;
        }

        .order-card:hover {
            transform: translateY(-4px);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .order-id {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: capitalize;
        }

        .status-confirmed { background: #e3f2fd; color: #1976d2; }
        .status-preparing { background: #fff3e0; color: #f57c00; }
        .status-ready { background: #e8f5e9; color: #388e3c; }
        .status-completed { background: #f5f5f5; color: #616161; }

        .customer-info {
            margin-bottom: 1rem;
        }

        .customer-name {
            font-weight: 600;
            font-size: 1.1rem;
            display: block;
        }

        .fulfillment-type {
            font-size: 0.875rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .items-list {
            margin: 1rem 0;
            padding: 0;
            list-style: none;
            flex-grow: 1;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 0.25rem;
        }

        .item-details {
            color: var(--text);
        }

        .item-qty {
            font-weight: 600;
            color: var(--primary);
        }

        .order-footer {
            border-top: 1px solid var(--border);
            padding-top: 1rem;
            margin-top: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .total-amount {
            font-weight: 700;
            font-size: 1.1rem;
        }

        .btn-next {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-next:hover {
            background-color: var(--primary-light);
        }

        .btn-next:disabled {
            background-color: var(--border);
            cursor: not-allowed;
            color: var(--text-muted);
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }

        @media (max-width: 600px) {
            main { padding: 1rem; }
            .orders-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header>
        <h1>☕ CafeBot Staff</h1>
        <div class="status-indicator">
            <div class="dot"></div>
            <span>Live Orders</span>
        </div>
    </header>

    <main>
        <div id="ordersContainer" class="orders-grid">
            <!-- Orders will be injected here -->
        </div>
    </main>

    <script>
        const API_BASE = '/api';
        const STATUS_FLOW = ['confirmed', 'preparing', 'ready', 'completed'];

        async function fetchOrders() {
            try {
                const response = await fetch(`${API_BASE}/orders`);
                const orders = await response.json();
                renderOrders(orders);
            } catch (error) {
                console.error('Error fetching orders:', error);
                document.getElementById('ordersContainer').innerHTML = '<div class="empty-state">Error loading orders. Please check server.</div>';
            }
        }

        async function updateStatus(orderId, currentStatus) {
            const currentIndex = STATUS_FLOW.indexOf(currentStatus);
            if (currentIndex >= STATUS_FLOW.length - 1) return;

            const nextStatus = STATUS_FLOW[currentIndex + 1];

            try {
                const response = await fetch(`${API_BASE}/orders/${orderId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: nextStatus })
                });

                if (response.ok) {
                    await fetchOrders();
                } else {
                    alert('Failed to update order status.');
                }
            } catch (error) {
                console.error('Error updating status:', error);
                alert('Network error occurred.');
            }
        }

        function renderOrders(orders) {
            const container = document.getElementById('ordersContainer');

            if (!orders || orders.length === 0) {
                container.innerHTML = '<div class="empty-state">No active orders. Time for a coffee break! ☕</div>';
                return;
            }

            container.innerHTML = orders.map(order => {
                const statusClass = `status-${order.status}`;
                const currentIndex = STATUS_FLOW.indexOf(order.status);
                const nextStatus = STATUS_FLOW[currentIndex + 1];
                const isCompleted = order.status === 'completed';

                return `
                    <div class="order-card">
                        <div class="order-header">
                            <span class="order-id">${order.orderId.substring(0, 8)}</span>
                            <span class="status-badge ${statusClass}">${order.status}</span>
                        </div>
                        <div class="customer-info">
                            <span class="customer-name">${order.customerDetails.name || 'Anonymous'}</span>
                            <span class="fulfillment-type">
                                ${order.orderType === 'pickup' ? '📦 Pickup' : '🚚 Delivery'}
                            </span>
                        </div>
                        <ul class="items-list">
                            ${order.items.map(item => `
                                <li class="item-row">
                                    <span class="item-details">
                                        ${item.name} ${item.options.length > 0 ? `(${item.options.join(', ')})` : ''}
                                    </span>
                                    <span class="item-qty">x${item.quantity}</span>
                                </li>
                            `).join('')}
                        </ul>
                        <div class="order-footer">
                            <span class="total-amount">$${order.total.toFixed(2)}</span>
                            <button
                                class="btn-next"
                                onclick="updateStatus('${order.orderId}', '${order.status}')"
                                ${isCompleted ? 'disabled' : ''}
                            >
                                ${isCompleted ? 'Completed' : `Mark as ${nextStatus}`}
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Initial load
        fetchOrders();
        // Simple polling every 30 seconds
        setInterval(fetchOrders, 30000);
    </script>
</body>
</html>
